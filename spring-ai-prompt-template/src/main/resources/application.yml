server:
  port: 10010

spring:
  application:
    name: spring-ai-nacos-prompt

  # 指定监听的 prompt 配置
  nacos:
    config:
      server-addr: 127.0.0.1:8848
      refresh-enabled: true
  ai:
    dashscope:
      api-key: sk-dbc8ed51cec741d388e0ca023d33b551
    # 开启 nacos 的 prompt tmpl 监听功能
    nacos:
      prompt:
        template:
          enabled: true
