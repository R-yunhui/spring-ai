spring:
  application:
    name: mcp-client
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        namespace: 3d1b1c58-f55a-4319-8799-643750f5aer5
        refresh-enabled: true
  config:
    import:
      - optional:nacos:llmConfig.yaml

  ai:
    openai:
      api-key: sk-0b8f679b8dfd4b649d53feabcb350b3f
    dashscope:
      api-key: sk-0b8f679b8dfd4b649d53feabcb350b3f
    bedrock:
      aws:
        region: us-east-1
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
        timeout: 5m
    mcp:
      client:
        ssl:
          verify: false
#        stdio:
#          servers-configuration: classpath:mcp-servers-config.json
          # 直接配置
          # connections:
          #   server1:
          #     command: java
          #     args:
          #       - -jar
          #       - /Users/xiadong/mcp-stdio-server-exmaple-0.0.1-SNAPSHOT.jar  # 放一个绝对路径，修改为server jar包所在位置
  mandatory-file-encoding: UTF-8
  main:
    allow-bean-definition-overriding: true

# 调试日志
logging:
  level:
    io:
      modelcontextprotocol:
        client: DEBUG
        spec: DEBUG

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
