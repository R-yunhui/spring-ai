<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿尔法视界 - 视频分析系统</title>
    <style>
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            color: #1890ff;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
        }
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .sidebar {
            width: 300px;
            padding-right: 20px;
            display: flex;
            flex-direction: column;
        }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            overflow: hidden;
        }
        .input-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: #fafafa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #eee;
            margin-bottom: 15px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        .input-label {
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
            font-size: 14px;
        }
        .required::after {
            content: "*";
            color: #f5222d;
            margin-left: 4px;
        }
        .input-description {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }
        textarea {
            height: 80px;
            padding: 10px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            resize: vertical;
            font-size: 14px;
            transition: all 0.3s;
        }
        textarea:focus {
            border-color: #40a9ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
            outline: none;
        }
        .video-id-input {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .video-id-input input {
            flex: 1;
            padding: 8px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            font-size: 14px;
        }
        .video-id-input input:focus {
            border-color: #40a9ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
            outline: none;
        }
        .video-id-input button {
            height: 32px;
            padding: 0 10px;
        }
        .video-id-list {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 5px;
        }
        .video-id-tag {
            background-color: #e6f7ff;
            border: 1px solid #91d5ff;
            border-radius: 4px;
            padding: 2px 8px;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
        }
        .video-id-tag span {
            font-size: 12px;
        }
        .video-id-tag button {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            padding: 0;
            font-size: 12px;
            line-height: 1;
        }
        .action-buttons {
            display: flex;
            justify-content: center;
        }
        .send-button {
            padding: 0 20px;
            height: 36px;
            background-color: #1890ff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-size: 14px;
            font-weight: 500;
        }
        .send-button:hover {
            background-color: #40a9ff;
        }
        .send-button:disabled {
            background-color: #d9d9d9;
            cursor: not-allowed;
        }
        .response-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background-color: #fafafa;
        }
        .user-message {
            margin-bottom: 16px;
            background-color: #e6f7ff;
            border-left: 3px solid #13c2c2;
            padding: 12px;
            border-radius: 6px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .assistant-message {
            margin-bottom: 16px;
            background-color: #f6ffed;
            border-left: 3px solid #52c41a;
            padding: 12px;
            border-radius: 6px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .error-message {
            margin-bottom: 16px;
            background-color: #fff2f0;
            border-left: 3px solid #f5222d;
            padding: 12px;
            border-radius: 6px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .loading {
            text-align: center;
            margin: 20px 0;
            color: #1890ff;
        }
        pre {
            white-space: pre-wrap;
            word-break: break-word;
            margin: 0;
        }
        .prompt-examples {
            margin-top: 10px;
        }
        .prompt-example {
            display: inline-block;
            margin-right: 8px;
            margin-bottom: 8px;
            background-color: #f5f5f5;
            border: 1px solid #e8e8e8;
            border-radius: 4px;
            padding: 3px 8px;
            font-size: 12px;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
        }
        .prompt-example:hover {
            background-color: #e6f7ff;
            border-color: #1890ff;
            color: #1890ff;
        }
        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .message-role {
            font-weight: 600;
            color: #333;
        }
        .message-timestamp {
            font-size: 12px;
            color: #999;
        }
        .thinking-section {
            color: #6c757d;
            margin-bottom: 10px;
            padding: 8px;
            background-color: #f8f9fa;
            border-radius: 4px;
        }
        .thinking-prefix {
            font-weight: bold;
            color: #6c757d;
            display: block;
            margin-bottom: 5px;
        }
        .content-section {
            color: #212529;
        }
        .content-prefix {
            font-weight: bold;
            color: #28a745;
            display: block;
            margin-bottom: 5px;
        }
        .chat-input-container {
            display: flex;
            padding: 10px;
            background-color: #fff;
            border-top: 1px solid #eee;
        }
        .chat-input {
            flex: 1;
            height: 60px;
            padding: 10px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            resize: none;
            font-size: 14px;
        }
        .chat-input:focus {
            border-color: #40a9ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
            outline: none;
        }
        .chat-send-button {
            margin-left: 10px;
            padding: 0 20px;
            height: 60px;
            background-color: #1890ff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .chat-send-button:hover {
            background-color: #40a9ff;
        }
        .chat-send-button:disabled {
            background-color: #d9d9d9;
            cursor: not-allowed;
        }
        .conversation-block {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>阿尔法视界 - 视频分析系统</h1>
        <div class="subtitle">智能视频分析与检索平台</div>
    </div>

    <div class="main-content">
        <div class="sidebar">
            <div class="input-section">
                <div class="input-group">
                    <label class="input-label required">提示词</label>
                    <div class="input-description">请输入您的问题或指令</div>
                    <textarea id="promptInput" placeholder="例如：查找所有发生了人员入侵事件的监控视频..."></textarea>
                    <div class="prompt-examples">
                        <div class="prompt-example" onclick="usePromptExample(this)">查找所有发生了人员入侵事件的监控视频</div>
                        <div class="prompt-example" onclick="usePromptExample(this)">分析这些视频中是否有安全隐患</div>
                        <div class="prompt-example" onclick="usePromptExample(this)">使用CV模型分析视频中的异常行为</div>
                        <div class="prompt-example" onclick="usePromptExample(this)">生成一份关于民生教育的报告</div>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label">视频ID列表（可选）</label>
                    <div class="video-id-input">
                        <input type="text" id="videoIdInput" placeholder="输入视频ID后点击添加">
                        <button onclick="addVideoId()" class="send-button" style="height: 32px;">添加</button>
                    </div>
                    <div class="video-id-list" id="videoIdList"></div>
                </div>

                <div class="action-buttons">
                    <button id="startButton" class="send-button" onclick="startConversation()">开始分析</button>
                </div>
            </div>
        </div>

        <div class="chat-area">
            <div class="response-container" id="responseContainer"></div>

            <div class="chat-input-container">
                <textarea id="chatInput" class="chat-input" placeholder="输入您的问题..." disabled></textarea>
                <button id="chatSendButton" class="chat-send-button" onclick="sendChatMessage()" disabled>发送</button>
            </div>
        </div>
    </div>
</div>

<script>
    let abortController = null;
    const responseContainer = document.getElementById('responseContainer');
    const promptInput = document.getElementById('promptInput');
    const videoIdInput = document.getElementById('videoIdInput');
    const videoIdList = document.getElementById('videoIdList');
    const startButton = document.getElementById('startButton');
    const chatInput = document.getElementById('chatInput');
    const chatSendButton = document.getElementById('chatSendButton');
    let videoIds = [];
    let isConversationStarted = false;
    let isWaitingForResponse = false;
    let currentRequestId = null;
    let currentConversationBlock = null;
    let currentAssistantMessage = null;
    let currentThinkingSection = null;
    let currentContentSection = null;

    function usePromptExample(element) {
        promptInput.value = element.textContent;
    }

    function addVideoId() {
        const videoId = videoIdInput.value.trim();
        if (!videoId) return;

        if (videoIds.includes(videoId)) {
            alert('该视频ID已添加');
            return;
        }

        videoIds.push(videoId);
        renderVideoIds();
        videoIdInput.value = '';
    }

    function removeVideoId(videoId) {
        videoIds = videoIds.filter(id => id !== videoId);
        renderVideoIds();
    }

    function renderVideoIds() {
        videoIdList.innerHTML = '';
        videoIds.forEach(id => {
            const tag = document.createElement('div');
            tag.className = 'video-id-tag';
            tag.innerHTML = `
                <span>${id}</span>
                <button onclick="removeVideoId('${id}')">×</button>
            `;
            videoIdList.appendChild(tag);
        });
    }

    function formatTimestamp(timestamp) {
        const date = new Date(timestamp);
        return date.toLocaleString('zh-CN', {
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
        });
    }

    function createNewConversationBlock() {
        currentConversationBlock = document.createElement('div');
        currentConversationBlock.className = 'conversation-block';
        responseContainer.appendChild(currentConversationBlock);

        // 重置当前对话的各个部分
        currentAssistantMessage = null;
        currentThinkingSection = null;
        currentContentSection = null;
    }

    function appendUserMessage(content) {
        // 创建新的对话块
        createNewConversationBlock();

        const userDiv = document.createElement('div');
        userDiv.className = 'user-message';

        const userHeader = document.createElement('div');
        userHeader.className = 'message-header';
        userHeader.innerHTML = `
            <span class="message-role">用户</span>
            <span class="message-timestamp">${formatTimestamp(Date.now())}</span>
        `;

        userDiv.appendChild(userHeader);
        userDiv.appendChild(document.createTextNode(content));

        currentConversationBlock.appendChild(userDiv);
        responseContainer.scrollTop = responseContainer.scrollHeight;
    }

    function appendAssistantContent(data) {
        // 检查是否是完成消息
        if (data.complete === true) {
            handleConversationCompleted();
            return;
        }

        // 如果没有当前助手消息区域，创建一个
        if (!currentAssistantMessage) {
            if (!currentConversationBlock) {
                createNewConversationBlock();
            }

            currentAssistantMessage = document.createElement('div');
            currentAssistantMessage.className = 'assistant-message';

            const assistantHeader = document.createElement('div');
            assistantHeader.className = 'message-header';
            assistantHeader.innerHTML = `
                <span class="message-role">助手</span>
                <span class="message-timestamp">${formatTimestamp(data.timestamp || Date.now())}</span>
            `;

            currentAssistantMessage.appendChild(assistantHeader);
            currentConversationBlock.appendChild(currentAssistantMessage);
        }

        // 处理思考内容
        if (data.reasonContent) {
            // 如果还没有思考区域，创建一个
            if (!currentThinkingSection) {
                currentThinkingSection = document.createElement('div');
                currentThinkingSection.className = 'thinking-section';

                const thinkingPrefix = document.createElement('div');
                thinkingPrefix.className = 'thinking-prefix';
                thinkingPrefix.textContent = '思考过程：';

                currentThinkingSection.appendChild(thinkingPrefix);
                currentAssistantMessage.appendChild(currentThinkingSection);
            }

            // 追加思考内容
            currentThinkingSection.appendChild(document.createTextNode(data.reasonContent));
        }

        // 处理主要内容
        if (data.content) {
            // 如果还没有内容区域，创建一个
            if (!currentContentSection) {
                currentContentSection = document.createElement('div');
                currentContentSection.className = 'content-section';

                const contentPrefix = document.createElement('div');
                contentPrefix.className = 'content-prefix';
                contentPrefix.textContent = '回复：';

                currentContentSection.appendChild(contentPrefix);
                currentAssistantMessage.appendChild(currentContentSection);
            }

            // 追加内容
            currentContentSection.appendChild(document.createTextNode(data.content));
        }

        responseContainer.scrollTop = responseContainer.scrollHeight;
    }

    function handleConversationCompleted() {
        console.log("会话已完成");
        // 重置当前对话的各个部分，准备下一轮对话
        currentAssistantMessage = null;
        currentThinkingSection = null;
        currentContentSection = null;
    }

    function appendErrorMessage(content) {
        const errorDiv = document.createElement('div');
        errorDiv.className = 'error-message';

        const errorHeader = document.createElement('div');
        errorHeader.className = 'message-header';
        errorHeader.innerHTML = `
            <span class="message-role">系统</span>
            <span class="message-timestamp">${formatTimestamp(Date.now())}</span>
        `;

        errorDiv.appendChild(errorHeader);
        errorDiv.appendChild(document.createTextNode(content));

        if (!currentConversationBlock) {
            createNewConversationBlock();
        }

        currentConversationBlock.appendChild(errorDiv);
        responseContainer.scrollTop = responseContainer.scrollHeight;
    }

    function appendLoadingIndicator() {
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'loading';
        loadingDiv.id = 'loadingIndicator';
        loadingDiv.textContent = '正在处理请求...';

        if (!currentConversationBlock) {
            createNewConversationBlock();
        }

        currentConversationBlock.appendChild(loadingDiv);
        responseContainer.scrollTop = responseContainer.scrollHeight;
    }

    function removeLoadingIndicator() {
        const loadingIndicator = document.getElementById('loadingIndicator');
        if (loadingIndicator) {
            loadingIndicator.remove();
        }
    }

    async function startConversation() {
        const message = promptInput.value.trim();
        if (!message) {
            alert('请输入提示词');
            return;
        }

        // 清空之前的对话
        responseContainer.innerHTML = '';
        currentConversationBlock = null;
        currentAssistantMessage = null;
        currentThinkingSection = null;
        currentContentSection = null;

        // 显示用户消息
        appendUserMessage(message);

        // 禁用初始输入区域，启用聊天输入区域
        promptInput.disabled = true;
        videoIdInput.disabled = true;
        startButton.disabled = true;

        // 设置会话已开始标志
        isConversationStarted = true;

        // 创建请求ID
        currentRequestId = Date.now().toString();

        // 发送初始消息
        await sendRequest(message, currentRequestId);

        // 启用聊天输入区域
        chatInput.disabled = false;
        chatSendButton.disabled = false;
    }

    async function sendChatMessage() {
        if (isWaitingForResponse) return;

        const message = chatInput.value.trim();
        if (!message) return;

        // 显示用户消息
        appendUserMessage(message);

        // 禁用聊天输入
        chatInput.disabled = true;
        chatSendButton.disabled = true;
        isWaitingForResponse = true;

        // 清空输入框
        chatInput.value = '';

        // 发送请求
        await sendRequest(message, currentRequestId);

        // 重新启用聊天输入
        chatInput.disabled = false;
        chatSendButton.disabled = false;
        isWaitingForResponse = false;
    }

    async function sendRequest(message, requestId) {
        // 取消之前的请求（如果有）
        if (abortController) {
            abortController.abort();
        }

        // 创建新的AbortController
        abortController = new AbortController();

        // 创建请求体，与ChatRequestVO匹配
        const requestBody = {
            prompt: message,
            requestId: requestId,
            videoIds: videoIds.length > 0 ? videoIds : null
        };

        // 添加加载指示器
        appendLoadingIndicator();

        try {
            // 发送POST请求并处理SSE响应
            const response = await fetch('/mcp/video/search/sse', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'text/event-stream'
                },
                body: JSON.stringify(requestBody),
                signal: abortController.signal
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            // 获取响应的reader
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            // 移除加载指示器
            removeLoadingIndicator();

            // 处理SSE数据
            while (true) {
                const { done, value } = await reader.read();

                if (done) {
                    break;
                }

                // 解码并处理数据
                buffer += decoder.decode(value, { stream: true });

                // 处理每一行SSE数据
                const lines = buffer.split('\n');
                buffer = lines.pop() || ''; // 保留最后一个不完整的行

                for (const line of lines) {
                    if (line.startsWith('data:')) {
                        const eventData = line.substring(5).trim();

                        try {
                            const data = JSON.parse(eventData);
                            appendAssistantContent(data);
                        } catch (e) {
                            appendErrorMessage(`解析错误: ${e.message}`);
                        }
                    }
                }
            }
        } catch (error) {
            // 处理错误
            if (error.name !== 'AbortError') {
                appendErrorMessage(`请求错误: ${error.message}`);
            }

            // 如果是初始对话出错，重置状态
            if (!isConversationStarted) {
                promptInput.disabled = false;
                videoIdInput.disabled = false;
                startButton.disabled = false;
            }
        } finally {
            // 移除加载指示器
            removeLoadingIndicator();
        }
    }

    // 添加键盘事件监听器
    promptInput.addEventListener('keydown', function(event) {
        if (event.key === 'Enter' && event.ctrlKey) {
            event.preventDefault();
            startConversation();
        }
    });

    chatInput.addEventListener('keydown', function(event) {
        if (event.key === 'Enter' && event.ctrlKey) {
            event.preventDefault();
            sendChatMessage();
        }
    });
</script>
</body>
</html>
